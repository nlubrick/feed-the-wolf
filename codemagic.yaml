# Feed the Wolf: manual cloud builds. The internal and release-candidate workflows upload builds to App Store Connect; neither submits for review or public release.
# Review candidate workflow added after the owner requested preparing an App Store submission. Never auto-submit.
#
#   android-beta-debug   tester build, debug APK, no credentials
#   ios-beta-simulator   tester build, simulator compile check, no credentials
#   ios-beta-signed      tester build, signed IPA, uploaded to App Store Connect for INTERNAL TestFlight
#                        (practice checkout, clearly labeled, no money; no beta review, no App Store submission)
#   ios-external-beta    external build, signed IPA for OUTSIDE testers (no practice checkout; Apple sandbox purchases
#                        through RevenueCat). Needs the Codemagic variable group "revenuecat_beta" with FTW_RC_IOS_KEY.
#   ios-appstore-review  PRODUCTION build, signed IPA; uploads to ASC WITHOUT submitting/releasing.
#                        Needs the Codemagic variable group "revenuecat_production" with FTW_RC_IOS_KEY.
#
# Every app build is stamped by scripts/set-app-version.cjs with a unique build number (minutes since 1970, UTC)
# and the version from package.json, so no upload is ever rejected as a duplicate.
workflows:
  android-beta-debug:
    name: Feed the Wolf BETA · Android debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install packages and test release separation
        script: |
          npm install --no-audit --no-fund
          npm test
          npm run release:check
      - name: Prepare shareable tester assets and Android project
        script: |
          node scripts/build-tester.cjs --www
          npx cap add android
          npx cap sync android
          # Unique, always-increasing build number; Google Play refuses a repeat.
          node scripts/set-app-version.cjs android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Compile debug APK without store credentials
        script: |
          java -version
          javac -version
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-beta-simulator:
    name: Feed the Wolf BETA · iOS simulator compile
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install packages and test release separation
        script: |
          npm install --no-audit --no-fund
          npm test
          npm run release:check
      - name: Generate iOS project with Swift Package Manager
        script: |
          node scripts/build-tester.cjs --www
          # This repo contains historical standalone Swift files in ios/.
          # Preserve them elsewhere in this temporary CI checkout before generating.
          if [ -d ios ] && [ ! -d ios/App/App.xcodeproj ]; then
            mv ios ios-legacy-source
          fi
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          # Unique, always-increasing build number; TestFlight refuses a repeat.
          node scripts/set-app-version.cjs ios
      - name: Compile unsigned iOS simulator app
        script: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/ios-build" \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - ios-build/Build/Products/Debug-iphonesimulator/*.app

  ios-beta-signed:
    name: Feed the Wolf BETA · Signed iPhone IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Uses the Apple API key already saved under Codemagic > Developer Portal.
    # The Apple Distribution certificate and App Store provisioning profile must
    # first be generated/fetched under Codemagic > Code signing identities.
    integrations:
      app_store_connect: Feed the Wolf Codemagic
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.failureentertainment.feedthewolf
    scripts:
      - name: Install packages and verify game/release checks
        script: |
          npm install --no-audit --no-fund
          npm test
          npm run release:check
      - name: Generate Capacitor beta iOS project using Swift Package Manager
        script: |
          node scripts/build-tester.cjs --www
          if [ -d ios ] && [ ! -d ios/App/App.xcodeproj ]; then
            mv ios ios-legacy-source
          fi
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          # Unique, always-increasing build number; TestFlight refuses a repeat.
          node scripts/set-app-version.cjs ios
      - name: Apply Apple Distribution signing profile
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build signed IPA for physical iPhones / TestFlight
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Uploads the signed build to App Store Connect so it appears under TestFlight for INTERNAL testers.
    # It does NOT send the build to Apple's beta review (needed only for outside testers) and it NEVER
    # submits to the public App Store. Who gets the build is decided by hand in App Store Connect.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  ios-external-beta:
    name: Feed the Wolf EXTERNAL BETA · Signed iPhone IPA (Apple sandbox purchases)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # For testers outside the team. Same code as production: no developer tools and no practice checkout.
    # Purchases go through Apple's sandbox via RevenueCat, so testers are never charged.
    integrations:
      app_store_connect: Feed the Wolf Codemagic
    environment:
      groups:
        - revenuecat_beta   # must define FTW_RC_IOS_KEY (RevenueCat public iOS SDK key)
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.failureentertainment.feedthewolf
    scripts:
      - name: Install packages, run tests, and require a clean external build with a store key
        script: |
          npm install --no-audit --no-fund
          npm test
          if [ -z "$FTW_RC_IOS_KEY" ]; then
            echo "FTW_RC_IOS_KEY is not set. Outside testers would have no way to unlock the game. Stopping."
            exit 1
          fi
          # The check wants both platform keys; this workflow only ships iOS.
          FTW_RC_ANDROID_KEY="${FTW_RC_ANDROID_KEY:-not-used-in-this-ios-build}" node scripts/check-release.cjs --target external --strict
      - name: Generate Capacitor iOS project from the external build
        script: |
          node scripts/build.cjs external --www
          if [ -d ios ] && [ ! -d ios/App/App.xcodeproj ]; then
            mv ios ios-legacy-source
          fi
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          # Unique, always-increasing build number; TestFlight refuses a repeat.
          node scripts/set-app-version.cjs ios
      - name: Apply Apple Distribution signing profile
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build signed IPA for external TestFlight testers
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # No publishing block by design. Upload to TestFlight and any App Store submission are separate, explicit steps.


  ios-appstore-review:
    name: Feed the Wolf RELEASE CANDIDATE · App Store Review IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Use the SAME iOS bundle ID as the installed TestFlight app, but build the
    # strictly clean production flavor: no DEV tools, fake checkout or BETA badge.
    integrations:
      app_store_connect: Feed the Wolf Codemagic
    environment:
      groups:
        - revenuecat_production  # user-created group with ONLY the iOS public SDK key
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.failureentertainment.feedthewolf
    scripts:
      - name: Test game and require real Apple purchase configuration
        script: |
          npm install --no-audit --no-fund
          npm test
          # The release gate rejects missing/test-store/iOS keys and any beta-only
          # checkout code. The actual IAP catalog must also be configured and
          # sandbox-tested in App Store Connect and RevenueCat before submission.
          node scripts/check-release.cjs --target production --strict --platform ios
      - name: Generate production iOS project and native App Store icon
        script: |
          node scripts/build.cjs production --www
          if [ -d ios ] && [ ! -d ios/App/App.xcodeproj ]; then
            mv ios ios-legacy-source
          fi
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          # Public first release is 1.0.0; internal TestFlight keeps 0.2.0.
          FTW_RELEASE_VERSION=1.0.0 node scripts/set-app-version.cjs ios
      - name: Apply Apple Distribution signing profile
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build signed iPhone IPA for App Store Connect
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Uploads only to App Store Connect. This does NOT submit the app
    # for review, TestFlight external review or public availability.
    # The owner explicitly chooses the version/build and submits manually.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
